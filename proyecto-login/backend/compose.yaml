services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: login
      POSTGRES_USER: login
      POSTGRES_PASSWORD: login_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - login_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U login -d login"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  login_pgdata:
